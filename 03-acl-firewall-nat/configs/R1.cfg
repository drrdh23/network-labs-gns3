version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
hostname R1
boot-start-marker
boot-end-marker
no aaa new-model
no ip icmp rate-limit unreachable
no ip domain lookup
ip cef
no ipv6 cef
multilink bundle-name authenticated
ip tcp synwait-time 5
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
interface GigabitEthernet0/0
 description LAN - Reseau entreprise
 ip address 192.168.10.1 255.255.255.0
 ip access-group PAREFEU-LAN in
 ip nat inside
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
interface GigabitEthernet1/0
 description WAN - Internet
 ip address dhcp
 ip nat outside
 negotiation auto
interface GigabitEthernet2/0
 no ip address
 shutdown
 negotiation auto
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
interface FastEthernet4/0
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet4/1
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet5/0
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet5/1
 no ip address
 shutdown
 speed auto
 duplex auto
interface Serial6/0
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
ip nat inside source list 1 interface GigabitEthernet1/0 overload
ip forward-protocol nd
no ip http server
no ip http secure-server
ip access-list extended PAREFEU-LAN
 remark Bloquer HTTP non chiffre
 deny   tcp 192.168.10.0 0.0.0.255 any eq www
 remark Bloquer Telnet
 deny   tcp 192.168.10.0 0.0.0.255 any eq telnet
 remark Autoriser tout le reste
 permit ip 192.168.10.0 0.0.0.255 any
access-list 1 permit 192.168.10.0 0.0.0.255
control-plane
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
end
